name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please report security vulnerabilities privately instead, see [SECURITY.md](https://github.com/roedylabs/hub/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Roedy Hub version
      description: Shown in the server log at start (`Roedy Hub started`) and by `roedy-hub --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Apps involved
      description: Apps behind the hub and their versions, if the problem concerns one.
      placeholder: "Roedy Mail 0.6.0"
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Firefox 150 on Linux, Safari on iOS 27, …
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker / Compose
        - Binary
        - Built from source
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server log lines or browser console output. Remove tokens, passwords and addresses first.
      render: text
