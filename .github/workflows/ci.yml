name: CI

# Lint, type check, tests and dependency policy of the web app and the server,
# the container image with its budgets and the Compose setup.
# "CI passed" is the single required check for these jobs (ruleset of main).
#
# Triggers: pull requests, merge queue, main, weekly (new Rust/Node versions,
# new advisories, warm cache on main) and manually.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: ESLint and Prettier
        run: pnpm lint

      # Linters as release binaries with pinned checksums, so that CI and
      # local runs use the same versions.
      - name: Install ShellCheck
        env:
          VERSION: 0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/v${VERSION}/shellcheck-v${VERSION}.linux.x86_64.tar.xz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${VERSION}/shellcheck"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          sudo install -m 0755 "$RUNNER_TEMP/actionlint" /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color

  web:
    name: Web app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Type check
        run: pnpm check
      - name: Unit tests
        run: VITEST_MAX_WORKERS=$(($(nproc) + 1)) pnpm test
      - name: Build
        run: pnpm build

  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt

      # The `embed-web` feature embeds apps/web/build into the binary; a
      # placeholder page is enough to compile and test it without waiting
      # for the web build.
      - name: Placeholder web build
        run: |
          mkdir -p apps/web/build
          echo '<!doctype html><title>Roedy Hub</title>' >apps/web/build/index.html
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked

  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Install cargo-deny and cargo-about
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2

      - name: Advisories, bans and sources (cargo deny)
        run: cargo deny --locked check advisories bans sources
      # License policy of the crates (about.toml); the same list ships in the image (Settings › About).
      - name: License list
        run: pnpm licenses:server

  # Container image and its budgets (docs/plan.md): the amd64 image from
  # `just dist`, ≤ 25 MB, and the smoke test with idle memory ≤ 40 MB
  # (scripts/image-smoke.sh), then deploy/compose.yml with Caddy and the
  # example app (scripts/compose-smoke.sh). The release (release.yml) builds
  # the same image for both platforms.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: ./.github/actions/setup-node
      - name: Set up the release build
        uses: ./.github/actions/setup-dist
        with:
          targets: x86_64-unknown-linux-musl

      - name: Web app and binary (just dist)
        run: pnpm exec just dist x86_64-unknown-linux-musl
      - name: Example app (just dist-example)
        run: pnpm exec just dist-example x86_64-unknown-linux-musl

      # BuildKit pinned by digest (.github/buildkit/Dockerfile).
      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-buildx
      - name: Build image
        run: docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false -t roedy-hub:dev .
      - name: Build example app image
        run: docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false -f deploy/example-app.Dockerfile -t roedy-hub-example:dev .

      - name: Image size (≤ 25 MB)
        run: |
          size=$(docker image inspect -f '{{.Size}}' roedy-hub:dev)
          binary=$(stat -c %s dist/amd64/roedy-hub)
          echo "Image linux/amd64: $((size / 1000)) kB (binary $((binary / 1000)) kB)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 25000000 ]; then
            echo "::error::Image larger than 25 MB"
            exit 1
          fi
      - name: Smoke test and idle memory (≤ 40 MB)
        run: scripts/image-smoke.sh roedy-hub:dev
      - name: Compose smoke test
        run: scripts/compose-smoke.sh

  # Single required status check for the ruleset of main: fails unless every
  # job above succeeded (also when one was skipped or cancelled).
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, web, server, dependencies, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo '| Job | Result |'
            echo '| --- | --- |'
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$NEEDS"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
