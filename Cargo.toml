[workspace]
resolver = "3"
members = ["crates/server", "crates/jmap", "crates/contract", "crates/example-app"]
# `cargo run` and `cargo build` without `-p` mean the hub; the checks use
# `--workspace` and include everything.
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/roedylabs/hub"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Goal: small binary and little memory.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Only line tables for our own crates, no debug info for dependencies:
# backtraces still name file and line, while test binaries and `target/` stay
# small and linking is fast.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
