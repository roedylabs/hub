# Roedy Hub (and Roedy Mail) under one origin – a production setup
# (docs/ops.md › Installation; taken over from Roedy Mail's deploy/compose.yml,
# ../mail). No proxy in front: the hub terminates TLS itself and gets its
# certificate from Let's Encrypt with its built-in ACME client (ROEDY_TLS=acme,
# docs/ops.md › TLS). Only the hub publishes ports:
#
#   443 → 8443  HTTPS: web app, API, apps under /<slug>/, TLS-ALPN-01
#   80  → 8080  HTTP: ACME HTTP-01 and a 308 to HTTPS, nothing else
#
# With the domain at deSEC, DNS-01 is the recommended validation: the CA looks
# up a TXT record instead of connecting to these ports. deploy/compose.dns01.yml
# adds it (COMPOSE_FILE=compose.yml:compose.dns01.yml in .env, the deSEC token
# as the Docker secret ./desec_token); port 80 then only redirects.
#
# The hub and the apps share the private network `apps`: the hub reaches the
# apps at their port 8080, the apps reach the hub's internal listener (8081),
# which binds to the hub's fixed address on `apps` and is never published. The
# apps publish nothing, so only the hub reaches them.
#
#   cp .env.example .env && chmod 600 .env     # then set ROEDY_PUBLIC_URL and
#                                              # ROEDY_ACME_AGREE_TOS=true (and
#                                              # COMPOSE_FILE for DNS-01)
#   docker compose up -d
#   docker compose logs roedy-hub | grep Setup-Token
#
# Settings come from environment variables or the .env file next to this file;
# .env.example is the template (all variables: docs/ops.md › Configuration).
# Empty values count as unset. deploy/compose.test.yml adds the example app for
# tests (profile `example`).
#
# Every app has a profile of its own named like its slug, so that only the
# apps in use run: COMPOSE_PROFILES=mail,calendar,contacts in .env starts
# them. To stop one, `docker compose stop roedy-calendar` and remove it from
# the list (Compose leaves the running container of a profile no longer
# listed alone). The hub has no profile and always runs; it never gets a
# Docker socket. Stopping a container only takes the app away – the hub then
# answers 502 at its address and still lists it; to take it out of the home
# page and the switchers, switch it off in Administration › Apps (docs/ops.md ›
# Switching apps on and off).

name: roedy

services:
  roedy-hub:
    # For predictable updates pin a version, e.g. ROEDY_IMAGE_TAG=0.1 in .env
    # (docs/ops.md › Updates).
    image: ghcr.io/roedylabs/hub:${ROEDY_IMAGE_TAG:-latest}
    container_name: roedy-hub
    restart: unless-stopped
    # User and group of the process; the image's default is 65532:65532. With
    # other IDs /data must belong to them (docs/ops.md › Container user). Never
    # 0 (root).
    user: "${ROEDY_UID:-65532}:${ROEDY_GID:-65532}"
    environment:
      # Required: public address of the hub, e.g. https://app.example.com
      # (scheme and host, no path). The apps live under /<slug>/ of it.
      ROEDY_PUBLIC_URL: ${ROEDY_PUBLIC_URL:?set ROEDY_PUBLIC_URL in .env, e.g. https://app.example.com}
      # The internal listener for the apps, only on the `apps` network.
      ROEDY_INTERNAL_LISTEN: ${ROEDY_HUB_APPS_IP:-172.30.240.2}:8081
      # Built-in TLS (docs/ops.md › TLS): acme by default; files with a
      # certificate of your own (mount it read-only and set the two paths);
      # off only behind a proxy of your own (then adjust `ports`).
      ROEDY_TLS: ${ROEDY_TLS:-acme}
      # Required with acme: true accepts the CA's terms of service. Without
      # it the hub refuses to start and says so.
      ROEDY_ACME_AGREE_TOS: ${ROEDY_ACME_AGREE_TOS:-}
      ROEDY_ACME_EMAIL: ${ROEDY_ACME_EMAIL:-}
      # Empty: Let's Encrypt production. Its staging directory for a first try.
      ROEDY_ACME_DIRECTORY: ${ROEDY_ACME_DIRECTORY:-}
      ROEDY_TLS_CERT_FILE: ${ROEDY_TLS_CERT_FILE:-}
      ROEDY_TLS_KEY_FILE: ${ROEDY_TLS_KEY_FILE:-}
      # Off: the hub is exposed directly and takes the client IP from the
      # connection. Only behind a proxy of your own (docs/ops.md › Behind your
      # own proxy); the apps behind the hub use this value plus one.
      ROEDY_TRUST_PROXY: ${ROEDY_TRUST_PROXY:-}
      ROEDY_LOG: ${ROEDY_LOG:-}
      ROEDY_LOG_FORMAT: ${ROEDY_LOG_FORMAT:-}
      # If unset, the first start creates /data/secret.key (docs/ops.md ›
      # Instance key); ROEDY_SECRET_KEY_FILE e.g. for a Docker secret.
      ROEDY_SECRET_KEY: ${ROEDY_SECRET_KEY:-}
      ROEDY_SECRET_KEY_FILE: ${ROEDY_SECRET_KEY_FILE:-}
    # HTTPS and HTTP, TCP only (the hub speaks no HTTP/3). Unprivileged ports
    # in the container, so no capability is needed; never publish 8081.
    ports:
      - "443:8443"
      - "80:8080"
    volumes:
      # Named volume: Docker takes owner 65532 from the image, so it only fits
      # the default ROEDY_UID/ROEDY_GID. With a bind mount the directory must
      # belong to ROEDY_UID:ROEDY_GID (default 65532:65532).
      - roedy-hub-data:/data
    networks:
      apps:
        ipv4_address: ${ROEDY_HUB_APPS_IP:-172.30.240.2}
    # The image needs no privileges: only /data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The server finishes running requests within 8 s.
    stop_grace_period: 10s
    # Same check and timings as the image's HEALTHCHECK: `roedy-hub
    # healthcheck` sends GET /healthz to the port of ROEDY_LISTEN over
    # loopback, with TLS on over TLS, and exits 0 on 200 (docs/ops.md ›
    # Health). It fails until the first certificate exists, usually within a
    # minute: hence the start period. Exec form: the image has no shell and no
    # curl. The image's start interval (1 s) applies within the start period.
    healthcheck:
      test: ["CMD", "roedy-hub", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 3m
      retries: 3

  # Roedy Mail behind the hub at <ROEDY_PUBLIC_URL>/mail, with the profile
  # `mail` (COMPOSE_PROFILES=mail in .env). Needs a Roedy Mail version with
  # hub mode; the hub's address and the pairing code are passed as the
  # contract's example app takes them (docs/ops.md › Pairing an app). In the
  # hub: Administration › Apps › Add, slug `mail`, internal address
  # http://roedy-mail:8080.
  #
  # Roedy Calendar and Roedy Contacts follow the same pattern once they are
  # released: a copy of this service named roedy-calendar or roedy-contacts,
  # with the profile, slug and volume `calendar` or `contacts`, their image
  # and their own ROEDY_<APP>_* variables, in the network `apps` only and
  # without `ports`.
  roedy-mail:
    profiles:
      - mail
    image: ghcr.io/roedylabs/mail:${ROEDY_MAIL_IMAGE_TAG:-latest}
    container_name: roedy-mail
    restart: unless-stopped
    user: "${ROEDY_MAIL_UID:-65532}:${ROEDY_MAIL_GID:-65532}"
    environment:
      # The app's public address is the hub's plus its slug (contract § 1).
      ROEDY_PUBLIC_URL: ${ROEDY_PUBLIC_URL:?set ROEDY_PUBLIC_URL in .env, e.g. https://app.example.com}/mail
      # The hub in front: the hub's ROEDY_TRUST_PROXY plus one.
      ROEDY_TRUST_PROXY: ${ROEDY_MAIL_TRUST_PROXY:-1}
      ROEDY_HUB_INTERNAL_URL: http://roedy-hub:8081
      # Code from Administration › Apps, valid for 15 minutes; only needed
      # until the app is paired.
      ROEDY_PAIRING_CODE: ${ROEDY_MAIL_PAIRING_CODE:-}
      ROEDY_LOG: ${ROEDY_LOG:-}
      ROEDY_LOG_FORMAT: ${ROEDY_LOG_FORMAT:-}
      # Mail's own instance key (not the hub's); if unset, its first start
      # creates /data/secret.key in its volume.
      ROEDY_SECRET_KEY: ${ROEDY_MAIL_SECRET_KEY:-}
    volumes:
      - roedy-mail-data:/data
    networks:
      - apps
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "roedy-mail", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      roedy-hub:
        condition: service_healthy

networks:
  # Not `internal`: the hub publishes its ports on it and apps such as Mail
  # need outgoing connections (Stalwart).
  # Fixed subnet for the hub's fixed address; change both in .env if it
  # collides with a network of the host.
  apps:
    ipam:
      config:
        - subnet: ${ROEDY_APPS_SUBNET:-172.30.240.0/24}

volumes:
  roedy-hub-data:
  roedy-mail-data:
