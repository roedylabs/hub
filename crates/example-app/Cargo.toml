[package]
name = "roedy-hub-example"
description = "The example app of Roedy Hub: implements the app contract for the hub's tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "roedy-hub-example"
path = "src/main.rs"

# A test app, not part of the image. The same crates and versions as the
# server, plus axum's `ws` feature (tokio-tungstenite) for the WebSocket echo
# the gateway tests need; the hub itself never parses WebSocket frames.
[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
roedy-hub-contract = { path = "../contract" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"

[dev-dependencies]
# A WebSocket client for the echo test: the crate axum's `ws` brings anyway.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
