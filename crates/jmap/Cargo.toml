[package]
name = "roedy-jmap"
description = "Minimal JMAP client for servers (RFC 8620, RFC 8621), shared by the Roedy apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["roedy", "jmap", "email", "rfc8620", "rfc8621"]
categories = ["email", "api-bindings", "network-programming"]
# Published on crates.io with the hub's release (scripts/packages.sh).
publish = true
include = ["/src", "/README.md"]

# Copy of Roedy Mail's `crates/jmap` (same versions), trimmed to sending.
[dependencies]
# The server builds the client (TLS, timeouts, no redirects)
# (`mailer::http_client`); this crate only makes the requests.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[lints]
workspace = true
