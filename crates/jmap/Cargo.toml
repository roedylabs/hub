[package]
name = "roedy-jmap"
description = "Minimal JMAP client for sending the Roedy Hub's system mails"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Copy of Roedy Mail's `crates/jmap` (same versions), trimmed to sending.
[dependencies]
# The server builds the client (TLS, timeouts, no redirects)
# (`mailer::http_client`); this crate only makes the requests.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"

[lints]
workspace = true
